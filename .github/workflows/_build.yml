name: "CI · Build"

on:
  workflow_call:

# Moved here from the job level: caller jobs cannot declare concurrency, so the
# gh-pages serialisation lives at the reusable-workflow level instead.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: Make sure it builds. Then show a preview.
    permissions: write-all
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      - name: Install dependencies
        run: npm ci
      - name: Set env
        shell: bash
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          echo "CESIUM_BASE_URL=pr-preview/pr-${PR_NUMBER}/" >> "$GITHUB_ENV"
      - name: Run build with Base
        run: npx vite build --base=${{ env.CESIUM_BASE_URL }}
        env:
          VITE_CESIUM_TOKEN: ${{ secrets.VITE_CESIUM_TOKEN }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./build/
