name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, reopened, synchronize, closed ]

# Use a single shared concurrency group so all runs that write to gh-pages are
# serialised. "preview-${{ github.ref }}" only serialises per PR, which still
# allows concurrent writes from different PRs (or synchronize vs. closed events)
# and causes "remote contains work not present locally" / rebase conflicts.
# cancel-in-progress: false ensures queued runs still execute (important for
# the "closed" event that removes a preview).
concurrency:
  group: gh-pages
  cancel-in-progress: false

# Least privilege by default; each job widens as needed.
permissions: {}

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Make sure it builds. Then show a preview.
    permissions: write-all
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      - name: Install dependencies
        run: npm ci
      - name: Set env
        shell: bash
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          echo "CESIUM_BASE_URL=pr-preview/pr-${PR_NUMBER}/" >> "$GITHUB_ENV"
      - name: Run build with Base
        run: npx vite build --base=${{ env.CESIUM_BASE_URL }}
        env:
          VITE_CESIUM_TOKEN: ${{ secrets.VITE_CESIUM_TOKEN }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./build/

  lint:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Make sure the code adheres to the XO coding standard.
    permissions: write-all
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      - name: Install dependencies
        run: npm ci
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          fingerprint: "38E6EABC680CCFCE10EA0454372717D2D3474974"
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_config_global: true
      - name: List keys
        run: gpg -K
      - name: Run linter
        uses: wearerequired/lint-action@v3
        with:
          auto_fix: true
          eslint: true
          commit_message: ":sparkles: Fix code style issues with ${linter}"
          git_email: Primajin@users.noreply.github.com

  test:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Make sure the the unit tests pass.
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      - name: Install dependencies
        run: npm ci
      - name: Run coverage
        run: npm run coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  console:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: build
    runs-on: ubuntu-latest
    name: Get console logs
    permissions: write-all
    env:
      PREVIEW_URL: https://happy-birthday.julia-hell.com/pr-preview/pr-${{ github.event.number }}/
    steps:
      - name: Wait for preview to be available
        run: |
          TIMEOUT=180
          INTERVAL=5
          ELAPSED=0
          until [ $ELAPSED -ge $TIMEOUT ]; do
            STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" "${PREVIEW_URL}" || true)
            if [[ "$STATUS" =~ ^2 ]]; then
              echo "Preview is available (HTTP $STATUS)"
              exit 0
            fi
            echo "Waiting for preview... (HTTP $STATUS, ${ELAPSED}s elapsed)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "Timed out waiting for preview after ${TIMEOUT}s"
          exit 1
        shell: bash
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Use WebApp Console Log Action
        uses: Primajin/webapp-console-log-action@v1
        with:
          webapp-url: ${{ env.PREVIEW_URL }}
          regexp-warning: '\[.+(?:Automatic fallback to software WebGL has been deprecated|GPU stall due to ReadPixels).*'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  screenshots:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: build
    runs-on: ubuntu-latest
    name: Take a screenshot after page was built
    permissions: write-all
    env:
      PREVIEW_URL: https://happy-birthday.julia-hell.com/pr-preview/pr-${{ github.event.number }}/
    steps:
      - name: Wait for preview to be available
        run: |
          TIMEOUT=180
          INTERVAL=5
          ELAPSED=0
          until [ $ELAPSED -ge $TIMEOUT ]; do
            STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" "${PREVIEW_URL}" || true)
            if [[ "$STATUS" =~ ^2 ]]; then
              echo "Preview is available (HTTP $STATUS)"
              exit 0
            fi
            echo "Waiting for preview... (HTTP $STATUS, ${ELAPSED}s elapsed)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "Timed out waiting for preview after ${TIMEOUT}s"
          exit 1
        shell: bash
      - name: Checkout code
        uses: actions/checkout@v7
      - name: install puppeteer-headful
        uses: mujo-code/puppeteer-headful@master
        env:
          CI: 'true'
      - name: screenshots-ci-action
        uses: Primajin/screenshots-ci-action@v3
        with:
          devices: iPhone 13,iPad Pro,iPad Pro landscape
          fullPage: false
          noDesktop: true
          releaseId: 291600528 # v1.0.0 release ID
          type: png
          url: ${{ env.PREVIEW_URL }}
          waitUntil: load
          # Wait ~10s for Cesium globe to load imagery tiles after page load.
          # Uses a non-existent selector so the timeout acts as a render delay;
          # the action catches the timeout and proceeds to take screenshots.
          waitForSelector: '#_render_delay'
          waitForSelectorTimeout: 10000
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          path: screenshots
          name: Download-screenshots

  all-green:
    name: All checks green
    if: always()
    needs:
      - build
      - lint
      - test
      - console
      - screenshots
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if any required job failed or was cancelled
        shell: bash
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required job did not pass (result=$r)."
              exit 1
            fi
          done
          echo "All jobs succeeded or were skipped."
