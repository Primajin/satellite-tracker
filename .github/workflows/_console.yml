name: "CI · Console"

on:
  workflow_call:

jobs:
  console:
    runs-on: ubuntu-latest
    name: Get console logs
    permissions:
      contents: read # checkout
      pull-requests: write # the console action posts a PR comment
    env:
      PREVIEW_URL: https://happy-birthday.julia-hell.com/pr-preview/pr-${{ github.event.number }}/
    steps:
      - name: Wait for the preview
        uses: Primajin/.github/actions/wait-for-url@v1
        with:
          url: ${{ env.PREVIEW_URL }}
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Use WebApp Console Log Action
        uses: Primajin/webapp-console-log-action@v2
        with:
          webapp-url: ${{ env.PREVIEW_URL }}
          regexp-warning: '\[.+(?:Automatic fallback to software WebGL has been deprecated|GPU stall due to ReadPixels).*'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
